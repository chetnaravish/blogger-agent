# ============================================================
#  Daily Blog Post - runs at 8:00 AM IST, every day
#
#  Cron "30 2 * * *" is UTC. UTC + 5:30 = IST, so 02:30 UTC = 08:00 IST.
#
#  NOTE: GitHub's cron can start a few minutes late, and on busy
#  days even later. That is normal and not a bug in this project.
# ============================================================

name: Daily Blog Post

on:
  schedule:
    # 8:00 AM IST every day. GitHub cron always uses UTC.
    - cron: "30 2 * * *"

  # Lets you trigger a run by hand from the Actions tab.
  # This is the only manual trigger - code pushes do NOT run the agent.
  #
  # It is ALSO used by the external 8 AM trigger (cron-job.org), which
  # sends: {"ref":"main","inputs":{"publish_as_draft":"auto"}}
  # "auto" means "decide by PUBLISH_LIVE_DAILY", exactly like the cron.
  # See docs/HOW-TO.md > "Exact 8 AM trigger".
  workflow_dispatch:
    inputs:
      publish_as_draft:
        description: "true = save as draft, false = publish live, auto = follow PUBLISH_LIVE_DAILY"
        required: false
        default: "true"
        type: string

# Two runs must never fight over the same posted.json.
concurrency:
  group: daily-blog
  cancel-in-progress: false

# Needed so we can push images and posted.json back to the repo.
permissions:
  contents: write

jobs:
  publish:
    name: Write and publish one post

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Get the code.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # 2. Set up Node.
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 3. Install the only dependency (dotenv).
      - name: Install dependencies
        run: npm ci

      # 4. Tell git who is committing.
      - name: Configure the bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 5. Run the agent. It saves images into images/ and pushes
      #    them itself, then waits for jsDelivr before publishing.
      #    That is why images and posted.json end up in TWO commits:
      #    the image must be on GitHub before the post can link to it.
      - name: Run the blog agent
        run: node src/index.js
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}

          # Pixabay gives the photos for the post. Add the same secret
          # in GitHub > Settings > Secrets and variables > Actions.
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

          # Optional ones. ${{ vars.X }} comes from repo Variables and
          # is empty when you never set it, which the code treats as
          # "use the default".
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          BLOG_NICHE: ${{ vars.BLOG_NICHE }}
          BLOG_LANGUAGE: ${{ vars.BLOG_LANGUAGE }}

          # Draft by default, so nothing goes live until you are ready.
          #
          # Manual run  : the "publish_as_draft" input above decides.
          # Scheduled run: "auto" means let PUBLISH_LIVE_DAILY decide.
          # Chetna confirmed LIVE daily mode on 2026-10-20, so scheduled
          # runs default to "true" here. To switch back to drafts, set the
          # repo variable PUBLISH_LIVE_DAILY = false (Settings > Secrets
          # and variables > Actions > Variables) - the variable wins.
          PUBLISH_AS_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_as_draft || 'auto' }}
          PUBLISH_LIVE_DAILY: ${{ vars.PUBLISH_LIVE_DAILY || 'true' }}

          # The agent may commit and push, so it needs write access.
          AUTO_COMMIT_PUSH: "true"

          # Log the result to the terminal, never print any secret.
          DOTENV_CONFIG_QUIET: "true"

      # 6. If the agent failed, print a plain-language diagnosis.
      #    check-env.js prints only variable NAMES, never values.
      - name: Diagnosis (only if the agent failed)
        if: failure()
        run: |
          echo "======================================================"
          echo " The blog agent failed. Here is what to look at:"
          echo "======================================================"
          echo ""
          echo "Any line marked MISSING below means that GitHub Secret is"
          echo "missing, empty, or has a stray quote/spaces in it."
          echo ""
          node scripts/check-env.js || true
          echo ""
          echo "If all keys are OK, the real error is in the 'Run the blog"
          echo "agent' step above - scroll up and read the FAILED box."
          echo "Most common causes:"
          echo "  * GOOGLE_REFRESH_TOKEN was revoked -> run 'npm run auth' locally"
          echo "  * GROQ_API_KEY was rotated -> copy the new one into .env"
          echo "  * a Groq model was retired -> the agent auto-picks a new one"
          echo ""
          echo "Full guide: docs/HOW-TO.md"

      # 7. Push the updated posted.json (only if it actually changed).
      #    The agent already pushed images in the previous step.
      - name: Commit posted.json if it changed
        run: |
          git add posted.json
          if git diff --staged --quiet --exit-code; then
            echo "posted.json did not change. Nothing to commit."
            exit 0
          fi
          git commit -m "chore: record post for $(date -u +%Y-%m-%d)"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      # 7. If we did not start on the default branch, tidy up.
      - name: Confirm the images are committed
        run: |
          echo "Files on the remote branch:"
          git ls-tree --name-only -r origin/${{ github.event.repository.default_branch }} -- images | tail -20

  # ============================================================
  #  Portfolio website - a SEPARATE job, separate code, separate log.
  #
  #  Runs after the Blogger job has finished (pass or fail), so the
  #  two never use Groq at the same time. It has its OWN topics
  #  (prompts/portfolio_topics.json - evergreen explainers such as
  #  "What is digital marketing"), written in first person in the
  #  portfolio's own template - and only every 3 days.
  #
  #  If this job fails, the Blogger post is untouched.
  # ============================================================
  portfolio:
    name: Portfolio post (every 3 days)
    needs: publish
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository (latest, with today's posted.json)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # It reads only. It never writes posted.json or touches Blogger.
      # The portfolio repo is changed through the GitHub API in ONE
      # atomic commit, and only when PORTFOLIO_PUBLISH is "true".
      - name: Run the portfolio publisher
        run: node src/portfolioEntry.js --scheduled
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PORTFOLIO_GH_TOKEN: ${{ secrets.PORTFOLIO_GH_TOKEN }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          PORTFOLIO_GROQ_MODEL: ${{ vars.PORTFOLIO_GROQ_MODEL }}
          PORTFOLIO_REPO: "chetnaravish/portfolio"
          PORTFOLIO_BRANCH: "main"
          PORTFOLIO_SITE_URL: "https://chetnaportflio.vercel.app"

          # Go live: add the repo variable PORTFOLIO_PUBLISH = true
          # (Settings > Secrets and variables > Actions > Variables).
          # Until then every run is a dry run with no GitHub writes.
          PORTFOLIO_PUBLISH: ${{ vars.PORTFOLIO_PUBLISH || 'false' }}

          # Minimum IST calendar days between portfolio posts.
          PORTFOLIO_INTERVAL_DAYS: ${{ vars.PORTFOLIO_INTERVAL_DAYS || '3' }}

          DOTENV_CONFIG_QUIET: "true"
